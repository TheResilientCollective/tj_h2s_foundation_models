[project]
name = "tsfm-h2s"
version = "0.1.0"
description = "Evaluating time-series foundation models (Timestral, TimesFM) for Tijuana River Valley H2S forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.9",
    "numpy",
    "pandas>=2.2",
    "pyarrow",
    "requests",
    "scipy",
    "matplotlib",
    "tqdm",
    # the models under test; torch is unpinned so a CUDA image's torch is kept.
    # The emscripten marker leaves them out of the wheel that marimo.app
    # installs in the browser (see notebooks/README.md); pip/uv elsewhere
    # install them as before.
    "torch>=2.4; sys_platform != 'emscripten'",
    "timestral @ git+https://github.com/mistralai/timestral.git ; sys_platform != 'emscripten'",
    "timesfm[torch] @ git+https://github.com/google-research/timesfm.git ; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
nrp = ["boto3"]  # results upload/fetch for the NRP GPU job

[dependency-groups]
dev = ["pytest", "pyyaml"]  # installed by default by `uv sync` / `uv run`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm_h2s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
