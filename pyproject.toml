[project]
name = "tsfm-h2s"
version = "0.1.0"
description = "Evaluating time-series foundation models (Timestral, TimesFM) for Tijuana River Valley H2S forecasting"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "marimo>=0.9",
    "numpy",
    "pandas>=2.2",
    "pyarrow",
    "requests",
    "scipy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
timestral = ["torch>=2.4", "timestral @ git+https://github.com/mistralai/timestral.git"]
timesfm = ["timesfm[torch] @ git+https://github.com/google-research/timesfm.git"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm_h2s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
