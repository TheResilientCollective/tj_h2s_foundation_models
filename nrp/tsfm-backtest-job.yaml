# GPU backtests on NRP (Nautilus), namespace ucsd-center4health.
#
# One Indexed Job: pod N runs line N of runs.txt (blank and # lines ignored)
# on its own GPU, then uploads its results parquet to the object store.
# Keep `completions` equal to the number of run lines. See nrp/README.md.
#
#   kubectl apply -n ucsd-center4health -f nrp/tsfm-backtest-job.yaml
#   kubectl get pods -n ucsd-center4health -l job-name=tsfm-h2s-backtest
#   uv run python scripts/nrp_results.py fetch    # locally, then open 04_leaderboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsfm-h2s-backtest-runs
  labels:
    project: tj-h2s-foundation-models
data:
  # Arguments to scripts/run_backtest.py (--device cuda is added).
  # Already done on CPU: baselines, timestral-5M (all modes), timesfm univariate.
  runs.txt: |
    # production origins, paired with XGBoost
    --model timesfm --mode covariates --weather forecast --batch-size 32
    --model timesfm --mode covariates --weather oracle --batch-size 32
    --model timesfm --mode multivariate_covariates --weather forecast --batch-size 32
    --model timestral-209M --mode univariate
    --model timestral-209M --mode covariates --weather forecast
    --model timestral-209M --mode covariates --weather oracle
    --model timestral-209M --mode multivariate_covariates --weather forecast
    --model timestral-28M --mode covariates --weather forecast --context 8192
    # winter events (2025-10 ->); oracle weather only, the forecast archive starts 2026-04-10
    --model timestral-209M --mode covariates --weather oracle --origins extended
    --model timesfm --mode covariates --weather oracle --origins extended --batch-size 32
    --model timestral-5M --mode univariate --origins extended
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tsfm-h2s-backtest
  labels:
    project: tj-h2s-foundation-models
spec:
  completionMode: Indexed
  completions: 11          # = number of run lines in runs.txt
  parallelism: 4           # GPUs held at once; be a good NRP citizen
  backoffLimitPerIndex: 1  # one retry per run; other runs carry on
  maxFailedIndexes: 11
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        project: tj-h2s-foundation-models
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 21600  # 6 h per pod
      # Optional: avoid small GPUs (209M + 8k context fits in 16 GB).
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: nvidia.com/gpu.product
      #               operator: In
      #               values: [NVIDIA-A10, NVIDIA-GeForce-RTX-3090, NVIDIA-A40, NVIDIA-L40]
      containers:
        - name: backtest
          image: pytorch/pytorch:2.14.1-cuda12.6-cudnn9-runtime
          workingDir: /work
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
              if [[ -n "${GH_TOKEN:-}" ]]; then AUTH="x-access-token:${GH_TOKEN}@"; else AUTH=""; fi
              git clone -q --depth 1 --branch "${GIT_REF}" "https://${AUTH}github.com/TheResilientCollective/tj_h2s_foundation_models.git" repo
              cd repo && git log --oneline -1
              # torch comes from the image (neither model pins it)
              pip install -q -e ".[nrp]"
              bash nrp/run_index.sh
          env:
            - name: GIT_REF
              value: main
            - name: HF_HOME          # model weights (Timestral-209M ~0.8 GB, TimesFM ~1.3 GB)
              value: /work/hf
            - name: TSFM_H2S_CACHE   # public data + weather-forecast archive cache
              value: /work/data
            - name: RESULTS_PREFIX
              value: tj_h2s_foundation_models/results/
            - name: GH_TOKEN         # only needed while the repo is private
              valueFrom:
                secretKeyRef:
                  name: tsfm-github
                  key: GH_TOKEN
                  optional: true
          envFrom:
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_ENDPOINT_URL,
            # DAGSTER_S3_BUCKET (same secret the dispersion workers use)
            - secretRef:
                name: object-store-credentials
          resources:
            # NRP: keep requests == limits for GPU pods
            requests:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: runs
              mountPath: /config
      volumes:
        - name: work
          emptyDir: {}
        - name: runs
          configMap:
            name: tsfm-h2s-backtest-runs
